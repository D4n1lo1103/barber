# Ambiente di sviluppo: il database gira in Docker, API e frontend
# si avviano con "pnpm dev" per avere il ricaricamento a caldo.
services:
  database:
    image: postgres:18-alpine
    container_name: barber-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: barber
      TZ: Europe/Rome
    ports:
      - '5432:5432'
    volumes:
      - dati-database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber -d barber']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dati-database:

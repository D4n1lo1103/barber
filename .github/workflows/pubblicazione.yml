name: Pubblicazione immagini

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: pubblicazione-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io

jobs:
  immagini:
    name: Costruzione e pubblicazione
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        applicazione: [api, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etichette dell'immagine
        id: etichette
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}/barber-${{ matrix.applicazione }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Costruzione e pubblicazione
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.applicazione }}/Dockerfile
          push: true
          tags: ${{ steps.etichette.outputs.tags }}
          labels: ${{ steps.etichette.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

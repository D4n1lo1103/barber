# Installazione di un salone: un VPS dedicato, un database dedicato.
# Le variabili arrivano dal file .env presente sul server, mai dall'immagine.
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Rome
    volumes:
      - dati-database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${REPOSITORY_GITHUB}/barber-api:${VERSIONE:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORTA: 3000
      DATABASE_URL: ${DATABASE_URL}
      SEGRETO_SESSIONE: ${SEGRETO_SESSIONE}
      ORIGINE_WEB: ${ORIGINE_WEB}
      DURATA_SESSIONE_ORE: ${DURATA_SESSIONE_ORE:-12}
      IDENTIFICATIVO_INSTALLAZIONE: ${IDENTIFICATIVO_INSTALLAZIONE}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/stato').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${REPOSITORY_GITHUB}/barber-web:${VERSIONE:-latest}
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMINIO_SALONE: ${DOMINIO_SALONE}
      EMAIL_AMMINISTRATORE: ${EMAIL_AMMINISTRATORE}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dati-caddy:/data
      - configurazione-caddy:/config

volumes:
  dati-database:
  dati-caddy:
  configurazione-caddy:
